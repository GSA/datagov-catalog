name: Publish image

# Publishes the catalog app image (with test dependencies) to GHCR so other
# repos can run catalog's test suite against their own services. datagov-harvester
# consumes this in its "Catalog Contract" workflow to verify that harvester DB /
# OpenSearch changes don't break catalog. See GSA/data.gov#6210.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build and publish to GHCR
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull_request so the build is still validated on forks, which
      # have no package write access.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gsa/datagov-catalog
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long

      # DEV=True installs the dev group so the image can run tests/unit.
      # On pull_request we build but don't push, which keeps the Alpine dev
      # install honest -- playwright has no musllinux wheel, so a regression
      # that puts browser deps back into the `dev` group fails here.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: DEV=True
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
