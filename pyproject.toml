[project]
name = "datagov-catalog"
version = "0.1.0"
description = "New Data.gov catalog UI"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = "<4.0,>=3.12"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "flask-htmx (>=0.4.0,<0.5.0)",
    "opensearch-py (>=3.2.0,<4.0.0)",
    "botocore (>=1.43.75,<2.0.0)",
    "beautifulsoup4 (>=4.14.2,<5.0.0)",
    "flask-talisman (>=1.1.0,<2.0.0)",
    "apiflask (>=3.1.1,<4.0.0)",
    "newrelic (>=11.5.0,<12.0.0)",
    "click (>=8.4.2,<9.0.0)",
    "flask-httpauth (>=4.8.1,<5.0.0)",
    "idna (>=3.18,<4.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "urllib3 (>=2.7.0,<3.0.0)",
    "soupsieve (>=2.9.2,<3.0.0)",
    "geoalchemy2 (>=0.20.0,<0.21.0)",
    "haversine (>=2.9.0,<3.0.0)",
]

[tool.poetry]
packages = [
    { include = "app" }
]

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
ruff = "0.16.3"
isort = "^8.0.1"
beautifulsoup4 = "^4.15.0"
moto = {version = ">=5.2.2,<6.0.0", extras = ["s3"]}
pytest = ">=9.1.1,<10.0.0"
pytest-playwright = "^0.9.0"
playwright = "^1.62.0"
axe-playwright-python = "^0.1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10"

[tool.pytest.ini_options]
markers = [
    # Accessibility checks are advisory (see the `accessibility` job in
    # .github/workflows/commit.yml, which is continue-on-error). They are
    # deselected from the blocking `make test-browser` run so an a11y finding
    # never blocks a merge on its own.
    "accessibility: axe-core accessibility checks; run via `make test-axe`",
]

[tool.isort]
profile = "black"
skip = [".poetry", "app/static/node_modules", ".venv"]

[tool.black]
target-version = ["py312"]
