worker_processes 2;
daemon off;

error_log stderr;

http {
  map_hash_bucket_size 128; #staging requires this to be higher than default of 64
  server_names_hash_bucket_size 128; #staging requires this to be higher than default of 64
  charset utf-8;
  log_format cloudfoundry 'NginxLog "$request" $status $body_bytes_sent "$http_x_amzn_waf_detection"';
  access_log /dev/stdout cloudfoundry;
  default_type application/octet-stream;
  include mime.types;
  sendfile on;

  tcp_nopush on;
  keepalive_timeout 30;
  port_in_redirect off; # Ensure that redirects don't include the internal container PORT - 8080

  # Responses were being served uncompressed (no Content-Encoding at all),
  # which Lighthouse flags as the single largest opportunity on catalog.data.gov
  # (~7.8s of its ~19s load time). text/html is compressed by nginx's built-in
  # default gzip_types even without being listed here; everything else served
  # by the app or from proxy/public needs to be listed explicitly.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/css
    text/plain
    text/javascript
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/xhtml+xml
    application/vnd.ms-fontobject
    font/ttf
    font/otf
    font/eot
    image/svg+xml;

  resolver {{nameservers}} valid=10s ipv6=off;

  include nginx-maps.conf;

  server {
    listen {{port}};
    root public;
    index index.html index.htm Default.htm;
  }

  {{if env "ALTERNATIVE_ROUTE"}}
  server {
    listen {{port}};
    server_name {{env "ALTERNATIVE_ROUTE"}};

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://{{env "EXTERNAL_ROUTE"}}$request_uri;
  }
  {{end}}

  ## Gunicorn specs
  server {
    server_name {{env "EXTERNAL_ROUTE"}};

    set $auth_enabled    {{env "BASIC_AUTH_ENABLED"}};
    auth_basic           $apply_auth; 
    auth_basic_user_file /home/vcap/app/etc/nginx/.htpasswd;

    include nginx-malicious.conf;
    include nginx-common.conf;
    include nginx-maintenance.conf;
  }
}

user nobody nogroup;
# 'user nobody nobody;' for systems with 'nobody' as a group instead
# cloud.gov does not like the 'pid' param
# pid /var/run/nginx.pid;

events {
  worker_connections 1024; # increase if you have lots of clients
  accept_mutex off; # set to 'on' if nginx worker_processes > 1
  # 'use epoll;' to enable for Linux 2.6+
  # 'use kqueue;' to enable for FreeBSD, OSX
}
