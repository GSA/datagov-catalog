# use 'listen 80 deferred;' for Linux
# use 'listen 80 accept_filter=httpready;' for FreeBSD
listen {{port}};

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

keepalive_timeout 5;

# path for static files
root ./public;

# simplify redirect with relative path
absolute_redirect off;

# redirect /en/ locales to english
location ~ ^/en/(.*) {
  return  301 /$1;
}

location / {
  # checks for static file, if not found proxy to app
  try_files $uri @proxy_to_app;
}

# maptiles requests require referrer from our apps.
location /maptiles {
  # only allow requests generated from our apps
  valid_referers server_names *.data.gov *.app.cloud.gov;
  if ($invalid_referer) {
    return   403;
  }
  include proxy_to_app.conf;
}


location = /dataset {
    return 301 /;
}

location = /dataset/ {
    return 301 /;
}

location @proxy_to_app {
  include proxy_to_app.conf;
}

location = /robots.txt {
  root ./public;
}

location = /sitemap.xml {
  auth_basic off;

  set $s3_url '{{env "S3_URL"}}';
  set $s3_bucket '{{env "S3_BUCKET"}}';
  proxy_pass https://${s3_url}/${s3_bucket}/sitemap.xml;
}

location /sitemap {
  auth_basic off;

  set $s3_url '{{env "S3_URL"}}';
  set $s3_bucket '{{env "S3_BUCKET"}}';
  proxy_pass https://${s3_url}/${s3_bucket}$request_uri;
}

proxy_intercept_errors on;
error_page 500 502 504 /500.html;
location = /500.html {
  root ./public;
}

error_page 403 /403.html;
location = /403.html {
  root ./public;
}

# Don't leak any server information in response headers
server_tokens off;
